[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "akmcsc2"
version = "0.1.0"
description = "AK-MCS-C2: Active Kriging Monte Carlo Simulation with conformal certification for failure probability estimation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Edgar Jaber" },
  { name = "Vincent Chabridon" },
  { name = "Mathilde Mougeot" },
]
keywords = ["structural reliability", "active learning", "kriging", "conformal prediction", "rare events"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.0",
  "gpytorch>=1.11",
]

[project.optional-dependencies]
experiments = ["matplotlib>=3.7", "pandas>=2.0", "joblib>=1.3", "tqdm>=4.65"]
dev = ["pytest>=7.0", "ruff"]

[project.urls]
Repository = "https://github.com/EdgarJaber/AK-MCS-C2"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
